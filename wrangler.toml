name = "mist-prep"
compatibility_date = "2026-09-01"
pages_build_output_dir = "dist"

# Create the namespace once (see README) and paste its id here, or bind it in the
# Cloudflare dashboard: Pages project -> Settings -> Bindings -> KV namespace (name: PROGRESS).
[[kv_namespaces]]
binding = "PROGRESS"
id = "b07182b387804a1987745f491f70fe53"

# Preview deployments (every branch except main) use their own, separate storage, so testing a branch can never
# read or change your real progress. The binding above stays the one production uses.
[[env.preview.kv_namespaces]]
binding = "PROGRESS"
id = "844e805660094eb49bf64faf5974bcca"
