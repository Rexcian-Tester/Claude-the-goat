<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>MIST Prep: one shot</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f3b2a"/><stop offset="1" stop-color="#0b1510"/></linearGradient>
    <radialGradient id="glow" cx=".72" cy=".26" r=".6"><stop offset="0" stop-color="#f3c969" stop-opacity=".38"/><stop offset="1" stop-color="#f3c969" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe7a8"/><stop offset=".55" stop-color="#eab54c"/><stop offset="1" stop-color="#b97a1f"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- countless timelines that lose -->
  <g fill="none" stroke="#e8efe6" stroke-linecap="round">
    <circle cx="256" cy="264" r="214" stroke-opacity=".07" stroke-width="3" stroke-dasharray="2 11"/>
    <circle cx="256" cy="264" r="184" stroke-opacity=".09" stroke-width="3" stroke-dasharray="14 9 3 9"/>
    <circle cx="256" cy="264" r="154" stroke-opacity=".08" stroke-width="3" stroke-dasharray="3 7"/>
  </g>
  <!-- the one that wins -->
  <path d="M256 50 A214 214 0 0 1 437 150" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>
  <path d="M437 118 L444 143 L469 150 L444 157 L437 182 L430 157 L405 150 L430 143 Z" fill="#fff4d2"/>
  <path d="M232 120 H304 V372 H346 V410 H190 V372 H232 V186 L190 214 L168 178 Z" fill="url(#gold)" stroke="#fff1c4" stroke-opacity=".35" stroke-width="3" stroke-linejoin="round"/>
</svg>
